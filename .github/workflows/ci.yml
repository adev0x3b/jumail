name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yml:ci/compose.ci.yml
      JUMAIL_SENDERS_DIR: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate throwaway certificates for the fake upstream
        run: ./ci/gen-certs.sh

      - name: Start relay + fake upstream
        run: docker compose up -d --wait jumail mailpit

      - name: Create the CI app logins
        run: |
          ./jumail user add julinks --password julinks-ci-secret --no-senders
          ./jumail user add jupdf --password jupdf-ci-secret --no-senders
          # through the CLI's allow-list write, while the relay is running
          ./jumail user add judesk --password judesk-ci-secret judesk@juume.site
          ./jumail user list

      - name: Smoke test
        run: docker compose run --rm smoke

      - name: Relay logs
        if: always()
        run: docker compose logs jumail mailpit

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
