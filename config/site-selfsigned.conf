## Alternative site config without a Cloudflare token: certificate files
## generated by `./jumail certs` (own CA, apps must trust certs/ca.pem).
## Picked with JUMAIL_TLS=selfsigned in .env.

tls file /etc/jumail/certs/server.pem /etc/jumail/certs/server.key {
    protocols tls1.2 tls1.3
}

target.smtp upstream {
    targets tcp://{env:RELAY_HOST}:{env:RELAY_PORT}
    starttls yes
    auth plain {env:RELAY_USER} {env:RELAY_PASSWORD}
    tls_client {
        protocols tls1.2 tls1.3
    }
}
