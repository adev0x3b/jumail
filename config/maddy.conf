## JuMail - send-only SMTP relay for all juume.site apps.
## Engine: maddy (https://maddy.email). Nothing here receives mail: no port 25,
## no IMAP, no mailboxes. Apps authenticate on 587 (STARTTLS), the message is
## DKIM-signed and queued, then handed to the upstream relay defined in site.conf.

$(hostname) = {env:JUMAIL_HOSTNAME}
$(primary_domain) = {env:JUMAIL_DOMAIN}
$(local_domains) = $(primary_domain)

hostname $(hostname)
autogenerated_msg_domain $(primary_domain)
log stderr_ts

# TLS certificate source and the upstream relay are deployment specific
# (ACME in production, self-signed + Mailpit in CI). See config/site-*.conf.
import /etc/jumail/site.conf

# ---------------------------------------------------------------------------
# App credentials: bcrypt hashes in an SQLite table inside the data
# volume. Managed with `./jumail user add|rm|list` (wraps `maddy creds`).

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

# Which From addresses each login may use. One line per app:
#   julinks: julinks@juume.site, noreply@juume.site
# A bare domain allows any address in it; "*" allows anything (don't).
table.file allowed_senders {
    file /etc/jumail/senders
}

# ---------------------------------------------------------------------------
# The only listener. Submission = authentication is mandatory, and because
# insecure_auth is off, AUTH is not even advertised before STARTTLS.

submission tcp://0.0.0.0:587 {
    insecure_auth no
    sasl_login yes
    max_message_size 10M
    max_header_size 256K
    read_timeout 2m
    write_timeout 1m
    auth &local_authdb

    limits {
        # Global budget shared by all apps (the provider's free quota is small).
        all rate {env:JUMAIL_RATE_BURST} {env:JUMAIL_RATE_PERIOD}
        all concurrency 10
        ip concurrency 4
    }

    source $(local_domains) {
        check {
            authorize_sender {
                user_to_email &allowed_senders
                check_header yes
                unauth_action reject
                no_match_action reject
                err_action reject
            }
        }
        default_destination {
            modify {
                # DKIM-sign with the key generated on first start in
                # /data/dkim_keys (`./jumail dkim` prints the DNS record).
                # The key is picked by envelope sender domain, which
                # authorize_sender has already tied to the login.
                dkim $(local_domains) {env:JUMAIL_DKIM_SELECTOR}
            }
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 501 5.1.8 "Sender domain is not handled by this relay"
    }
}

# On-disk queue with exponential retry (18 min, 21, 25, ... up to max_tries).
# No bounce block on purpose: there is no mailbox to deliver DSNs to, failures
# are logged instead (`./jumail logs`, `./jumail queue`).
target.queue remote_queue {
    target &upstream
    max_tries 12
}
