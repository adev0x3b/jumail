## Production site config: real certificate from Let's Encrypt (DNS-01 through
## a Cloudflare API token scoped to Zone:DNS:Edit on the one zone), upstream
## relay from .env. Picked with JUMAIL_TLS=acme (the default).

tls {
    loader acme {
        hostname {env:JUMAIL_HOSTNAME}
        email {env:ACME_EMAIL}
        agreed
        challenge dns-01
        dns cloudflare {
            api_token {env:CLOUDFLARE_API_TOKEN}
        }
    }
    protocols tls1.2 tls1.3
}

target.smtp upstream {
    targets tcp://{env:RELAY_HOST}:{env:RELAY_PORT}
    starttls yes
    auth plain {env:RELAY_USER} {env:RELAY_PASSWORD}
    tls_client {
        protocols tls1.2 tls1.3
    }
}
