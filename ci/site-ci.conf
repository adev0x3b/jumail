## CI site config: throwaway self-signed certificate generated by maddy at
## start, upstream is Mailpit playing the role of Brevo (STARTTLS + AUTH).

tls {
    loader self_signed {env:JUMAIL_HOSTNAME}
    protocols tls1.2 tls1.3
}

target.smtp upstream {
    targets tcp://mailpit:1025
    starttls yes
    auth plain ci-relay ci-relay-secret
    tls_client {
        protocols tls1.2 tls1.3
        root_ca /etc/jumail/ci/ca.pem
    }
}
